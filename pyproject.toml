[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepearth"
version = "1.0.0"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
  "deepearth",
  "deepearth.autoresearch",
  "deepearth.core",
  "deepearth.encoders",
  "deepearth.encoders.biological",
  "deepearth.encoders.spacetime",
  "deepearth.encoders.spacetime.hashencoder",
  "deepearth.data",
  "deepearth.data.deepcal",
  "deepearth.data.deepcal.env_priors",
  "deepearth.data.deepcal.pollinator",
  "dashboard",
]
package-dir = {deepearth = ".", dashboard = "dashboard"}

[tool.setuptools.package-data]
"deepearth.encoders.spacetime" = ["*.md", "*.sh"]
"deepearth.encoders.spacetime.hashencoder" = ["src/*", "*.toml"]
"deepearth.data.deepcal" = ["*.md", "*.yaml", "*.R"]
dashboard = ["*.md", "seed/*.json", "static/*", "hooks/*.sh", "tests/*.js"]
