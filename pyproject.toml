[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepearth"
version = "1.0.0"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
  "deepearth",
  "deepearth.autoresearch",
  "deepearth.core",
  "deepearth.encoders",
  "deepearth.encoders.biological",
  "deepearth.encoders.spacetime",
  "deepearth.encoders.spacetime.hashencoder",
]
package-dir = {deepearth = "."}
